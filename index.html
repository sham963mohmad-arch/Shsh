<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .balance-box {
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 10px;
      margin: 16px 0;
      font-size: 1.1rem;
    }
    button {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="greeting">مرحباً بك!</h2>
    <div class="balance-box">
      🎁 الرصيد: <strong>0 هدايا</strong>
    </div>
    <button onclick="Telegram.WebApp.showAlert('تم النقر بنجاح!')">تجربة التفاعل</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('greeting').innerText = 'مرحباً، ' + tg.initDataUnsafe.user.first_name;
    }
  </script>
</body>
</html>
